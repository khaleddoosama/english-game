# Every push and pull request: lint (undefined names, hooks called out of
# order), the unit tests, the build, the browser specs, every database
# migration plus the SQL tests on a fresh Postgres, and the real stack
# (Supabase's own Postgres, GoTrue and PostgREST, with supabase-js).
name: CI
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npx vite build

  # The built app in a real browser, in local mode (no database).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npx vite build
      - run: npm run e2e

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: supabase/ci/run-tests.sh
      # The app's library API against the real SQL functions just migrated above.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/library-contract.test.js tests/library-differential.test.js
      # The app's code against the real SQL functions as anon / authenticated (tests/integration).
      - run: PGADMIN=$PGURL supabase/ci/run-integration.sh
      # Upgrade and rollback of migrations 0037-0042 on a database as it was before them, with made-up
      # data, comparing the whole schema (functions and who may execute them, tables, RLS, constraints...)
      # before and after the rollback. Makes and drops its own database.
      - run: PGADMIN=$PGURL supabase/ci/check-upgrade.sh
      # A real tab closed after a save whose answer was lost, with the game's own repo code in Chromium and
      # the migrated database behind it (the spec is skipped without PGURL, so the e2e job above skips it).
      - run: npx playwright-core install --with-deps chromium
      - run: node e2e/specs/saveclose.cjs

  # Supabase's own images (Postgres 15.8, GoTrue, PostgREST, Realtime) with every migration, and supabase-js signing
  # players in and listening (tests/realstack). Fails if any of those tests is skipped. Not in it: Storage.
  realstack:
    runs-on: ubuntu-latest
    env:
      WITH_REALTIME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: tests/realstack/up.sh
      - run: tests/realstack/run-ci.sh
